name: Deploy Hermes web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The deploy gate. GitHub cannot make one workflow depend on another, so the
  # release checks run here as well as in CI. A deploy that skipped them would
  # be a deploy nobody verified.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: Unit and safety tests
        run: npm test
      - name: Behavioural evaluation gate
        run: npm run eval:behaviour
      - name: Edge bundle smoke test
        run: npm run smoke:edge

  build:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static web application
        env:
          # Public endpoint, not a credential. Runtime secrets live in Supabase.
          VITE_API_URL: https://wkqhlcilewyskpfvndsd.supabase.co/functions/v1/api
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build --workspace=apps/web
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
