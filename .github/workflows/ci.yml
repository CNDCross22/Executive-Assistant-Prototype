name: CI

# Runs on every pull request and every push to main. The Pages workflow runs
# the same checks as its own gate before it deploys, so a broken commit cannot
# reach the Director by way of a green-looking deploy.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests and behavioural evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Unit and safety tests
        run: npm test

      # The behavioural suite is a release gate, not a report: it exits non-zero
      # when a reference response regresses or a negative control stops being
      # caught. It needs no API key and makes no model call.
      - name: Behavioural evaluation gate
        run: npm run eval:behaviour

      - name: Build web client
        run: npm run build --workspace=apps/web

      # Boots the artefact that actually gets deployed. Catches a bundling or
      # runtime-shim regression here rather than in front of the Director.
      - name: Edge bundle smoke test
        run: npm run smoke:edge

  # Applies every migration from the first to the latest against an empty
  # database. plpgsql resolves column names at execution rather than creation,
  # so a function can be created happily and fail only when first called —
  # which is exactly how a retention bug reached production and would have
  # silently deleted nothing. This runs the SQL for real.
  migrations:
    name: Migrations apply from scratch
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: hermes
          POSTGRES_DB: hermes_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply every migration
        env:
          DATABASE_URL: postgres://postgres:hermes@127.0.0.1:5432/hermes_ci
        run: npm run db:migrate

      - name: Re-run to prove migrations are idempotent
        env:
          DATABASE_URL: postgres://postgres:hermes@127.0.0.1:5432/hermes_ci
        run: npm run db:migrate

      - name: Exercise the retention function
        env:
          DATABASE_URL: postgres://postgres:hermes@127.0.0.1:5432/hermes_ci
        # A dry run counts rows with the same predicates the real prune uses,
        # so a wrong column name fails here rather than at 14:10 UTC in silence.
        run: npm run db:prune -- --dry-run
